model_name: ads_transformer_side
seed: 2025
device: cuda
data_dir: data/processed
checkpoint_dir: checkpoints
log_dir: logs
output_dir: outputs

max_seq_len: 50
embedding_dim: 32
d_s: 64
d_q: 64
d_D: 64
d_attn: 64
psrg_hidden_dim: 128
pcrg_hidden_dim: 128
psrg_eta: 2.0
dropout: 0.1

batch_size: 2048
epochs: 20
lr: 0.001
weight_decay: 0.000001
num_workers: 4
early_stop_patience: 3
save_best_auc_checkpoint: true

use_psrg: true
use_pcrg: true
use_transformer: true
use_behavior_side: true
use_category: true
use_caption: false
use_video_stat: false

side_dim: 16
side_output_dim: 32
transformer_d_model: 64
transformer_heads: 4
transformer_layers: 1
transformer_ffn_dim: 256
interest_ffn_dim: 256
