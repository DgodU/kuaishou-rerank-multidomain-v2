model_name: ads_transformer_side
run_name: sidebias_userpair
seed: 2025
device: cuda
data_dir: data/processed
checkpoint_dir: checkpoints
log_dir: logs
output_dir: outputs

max_seq_len: 50
embedding_dim: 32
d_s: 64
d_q: 64
d_D: 64
d_attn: 64
psrg_hidden_dim: 128
pcrg_hidden_dim: 128
psrg_eta: 2.0
dropout: 0.1

batch_size: 1024
epochs: 20
lr: 0.001
weight_decay: 0.000001
num_workers: 2
pin_memory: true
persistent_workers: true
prefetch_factor: 2
early_stop_patience: 4
save_best_auc_checkpoint: true

use_user_group_sampler: true
user_group_samples_per_user: 4
user_group_drop_last: false

use_ema: false
ema_decay: 0.995
ema_warmup_steps: 300

use_psrg: true
use_pcrg: true
use_transformer: true
use_behavior_side: true
use_category: true
use_caption: false
use_video_stat: false

side_dim: 16
side_output_dim: 32
transformer_d_model: 64
transformer_heads: 4
transformer_layers: 1
transformer_ffn_dim: 256
interest_ffn_dim: 256
use_ads_kv_backbone: true
transformer_kv_residual_init: 0.1
use_side_attention_bias: true
use_side_attention_interactions: false
use_side_attention_match_features: false
use_side_attention_gate: false
side_attention_bias_scale: 0.1
side_attention_bias_hidden_dim: 64

use_pairwise_loss: true
pairwise_loss_mode: all_pairs
pairwise_loss_weight: 0.02
pairwise_max_pairs_per_user: 32
pairwise_label_threshold: 0.5
